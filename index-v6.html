<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>优一 · 作品集 — Kanjyo Hirako</title>
<meta name="description" content="优一（Kanjyo Hirako）的个人项目作品集 —— 六张项目图贴在同一个圆柱面上，随滚动自上而下沿螺旋环绕，从左上角一直转到右下角。">
<meta name="theme-color" content="#ffffff">
<!--
  单文件自包含：零外部请求，零背景层。
  背景就是纯白（--bg），页面上没有任何东西盖在它上面 —— 主体是纯 CSS 3D 的圆柱体螺旋。
-->
<style>
/* ═══════════════ 1. 设计令牌（浅色 / 纯白） ═══════════════ */
:root{
  color-scheme: light;

  /* 先写 hex 兜底，再写 oklch —— 不认识 oklch 的浏览器保留上一行 */
  --bg:#ffffff;         --bg: oklch(1 0 0);
  --fg:#16181d;         --fg: oklch(0.20 0.015 265);
  --fg-2:#4a4d54;       --fg-2: oklch(0.36 0.012 265);
  --muted:#6b6e75;      --muted: oklch(0.47 0.012 265);
  --border:#e2e3e6;     --border: oklch(0.90 0.006 265);
  --accent:#0e7a3c;     --accent: oklch(0.48 0.155 150);
  --accent-soft:#e8f4ec; --accent-soft: oklch(0.95 0.035 150);

  --font-display: 'Space Grotesk','Segoe UI Variable Display','Segoe UI',system-ui,'PingFang SC','Microsoft YaHei',sans-serif;
  --font-body: 'Inter',system-ui,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono: 'JetBrains Mono','Cascadia Code',ui-monospace,Consolas,monospace;

  --pad: clamp(20px, 4.2vw, 76px);
  --ease-out: cubic-bezier(.2, 0, 0, 1);
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }

body{
  margin:0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size:16px;
  line-height:1.6;
  /* clip 而非 hidden：hidden 会让 body 变成滚动容器，position:sticky 会失效 */
  overflow-x:clip;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

p{ text-wrap:pretty; }
h1,h2,h3{ text-wrap:balance; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }

/* ═══════════════ 2. 页面图层 ═══════════════ */
/* 背景是纯白（--bg），页面上没有任何背景层 —— 圆柱是唯一的视觉 */
.page{ position:relative; z-index:2; }

/* ═══════════════ 3. Hero ═══════════════ */
.hero{
  position:relative;
  min-height:100vh; min-height:100svh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center;
  padding: var(--pad);
}
.hero__inner{ display:flex; flex-direction:column; align-items:center; max-width:900px; }

.hero__kicker{
  display:inline-flex; align-items:center; gap:10px;
  margin:0 0 clamp(14px, 2.2vw, 26px);
  font-family: var(--font-mono);
  font-size: clamp(11px, 1vw, 13px);
  letter-spacing:.4em;
  text-transform:uppercase;
  color: var(--accent);
  /* 行尾字距会让整块视觉偏左半个字距，用负右边距抵回来 */
  margin-right:-.4em;
}
.hero__kicker::before{
  content:''; flex:none;
  width:6px; height:6px; border-radius:1px;
  background: var(--accent);
}
.hero__name{
  margin:0;
  font-family: var(--font-display);
  font-size: clamp(64px, 15vw, 196px);
  line-height:1; font-weight:800; letter-spacing:0;
}
.hero__motto{
  margin: clamp(16px, 2.4vw, 30px) 0 0;
  font-size: clamp(15px, 1.7vw, 21px);
  line-height:1.75;
}
.hero__tagline{
  margin: clamp(10px, 1.4vw, 16px) 0 0;
  font-family: var(--font-mono);
  font-size: clamp(10px, .92vw, 12px);
  letter-spacing:.22em; text-indent:.22em;
  text-transform:uppercase;
  color: var(--muted);
}
.hero__rule{
  width: clamp(120px, 22vw, 260px);
  height:1px; margin: clamp(34px, 6vh, 66px) 0 0;
  background: var(--border);
}
.hero__scroll{
  margin: clamp(16px, 2.6vh, 26px) 0 0;
  font-family: var(--font-mono);
  font-size:10.5px; letter-spacing:.3em;
  text-transform:uppercase;
  color: var(--muted);
}
/* 呼吸动画放在内层，避免与 [data-reveal] 的 transform 互相覆盖 */
.hero__scroll-in{
  display:inline-block;
  margin-right:-.3em;                 /* 同上，抵消行尾字距 */
  animation: breathe 2.8s var(--ease-out) infinite;
}
@keyframes breathe{
  0%,100%{ opacity:.55; transform: translateY(0); }
  50%    { opacity:1;   transform: translateY(4px); }
}

.hero [data-reveal]{
  opacity:0;
  transform: translateY(14px);
  transition: opacity .8s ease, transform .8s var(--ease-out);
  transition-delay: var(--d, 0ms);
}
body.is-ready .hero [data-reveal]{ opacity:1; transform:none; }
body.no-entry .hero [data-reveal]{ transition:none; }

/* ═══════════════ 4. 章节标题 ═══════════════ */
.section-head{
  padding: clamp(80px, 17vh, 180px) var(--pad) clamp(12px, 2.4vh, 26px);
  max-width:1240px; margin:0 auto;
}
.section-head__kicker{
  margin:0 0 10px;
  font-family: var(--font-mono);
  font-size:11px; letter-spacing:.34em; text-transform:uppercase;
  color: var(--muted);
}
.section-head__title{
  margin:0;
  font-family: var(--font-display);
  font-size: clamp(30px, 4.4vw, 56px);
  font-weight:700; line-height:1.15;
}

/* ═══════════════ 5. 圆柱舞台 ═══════════════ */
.projects{ position:relative; }
.track{ position:relative; }
.stage{ position:relative; }

.is-animated .track{ height:420vh; }
.is-animated .stage{
  position:sticky; top:0;
  height:100vh; height:100svh;
  overflow:hidden;              /* sticky 元素自身裁剪，不影响自身粘性 */
  perspective: 1400px;          /* 运行时由 JS 按半径重设 */
  perspective-origin: 50% 50%;
}

.cylinder{ position:absolute; inset:0; transform-style: preserve-3d; }

/* 卡片贴在圆柱面上：原点落在容器中心，绕柱轴 rotateY，再推出半径 */
.cylinder .card{
  position:absolute; left:50%; top:50%;
  transform-origin: 0 0;
  will-change: transform;
}
/* 圆柱是透明的：背面卡片照样绘制，但不接收点击（由内层白色遮罩压淡） */
.cylinder .card.is-back{ pointer-events:none; }
/* 遮罩只能盖住卡片本体，盖不住外部的投影 —— 背面卡片直接把投影去掉，否则会留下一团灰影 */
.cylinder .card.is-back{ box-shadow:none; }

/* 转到背面时，卡片自己的文字会镜像 —— 那是最扎眼的部分，必须藏掉：
   标题、描述、标签、编号、↗ 都是清晰的大字号 DOM 文本，镜像后一眼就是 bug。
   但**截图要留着**：它是背面卡片唯一的颜色来源，也是判断螺旋走向的线索。
   代价是截图里的字也会镜像 —— 实测 2500px 原图缩到 ~150px 后，
   里面的标题仍有约 10 设备像素高，读得出来。这个交给下面的 blur 处理。 */
.cylinder .card.is-back .card__no,
.cylinder .card.is-back .card__go,
.cylinder .card.is-back .card__soon,
.cylinder .card.is-back .card__body{ visibility:hidden; }
/* 用 visibility 而非 display —— 前者保留占位，卡片高度不会塌 */
.cylinder .card.is-back .card__media{ border-color: oklch(0.93 0.004 265); }
/* 白色遮罩会一并抽掉饱和度，这里补一点回来；
   再叠一层模糊 —— 背面是镜像绘制的，截图里的字（「A space to focus & breathe」之类）
   在小尺寸下仍然读得出来。模糊保留色块、抹掉字形：留下颜色，不留内容。 */
.cylinder .card.is-back .card__media img{ filter: blur(4px) saturate(1.25); }

/* —— 静态（窄屏 / 减少动效）：回到正常文档流 —— */
.cards{
  display:grid; gap:20px;
  grid-template-columns: 1fr;
  padding: 0 var(--pad) clamp(40px, 8vh, 90px);
  max-width:1240px; margin:0 auto;
}
@media (min-width:620px){ .cards{ grid-template-columns: repeat(2, 1fr); } }

.cards .card{
  position:relative;
  opacity:0; transform: translateY(20px);
  transition: opacity .55s ease, transform .55s var(--ease-out);
}
.cards .card.in{ opacity:1; transform:none; }

/* ═══════════════ 6. 项目卡片（浅色） ═══════════════ */
.card{
  display:flex; flex-direction:column; gap:11px;
  padding:10px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow: 0 1px 2px oklch(0.2 0.02 265 / .05),
              0 18px 34px -22px oklch(0.2 0.02 265 / .24);
  transition: box-shadow .3s ease;
}

/* 深度遮罩：转到侧面的卡片向白底退去，强化体积感 */
.card__veil{
  position:absolute; inset:-1px;
  border-radius:inherit;
  background:#fff;
  opacity:0;
  pointer-events:none;
  z-index:3;
}

/* —— 图片区：卡片内唯一的链接 —— */
.card__media{
  position:relative; display:block; width:100%;
  aspect-ratio: 16 / 10;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background: oklch(0.97 0.004 265);
  color:inherit; text-decoration:none;
  transition: border-color .18s ease, box-shadow .22s ease;
}
a.card__media{ cursor:pointer; }
a.card__media:hover{ border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
a.card__media:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
.card__media.is-disabled{ cursor:not-allowed; }

.card__media img{
  display:block; width:100%; height:100%;
  object-fit:cover;
  transition: transform .3s var(--ease-out), filter .3s ease;
}
a.card__media:hover img{ transform: scale(1.03); }
a.card__media:active img{ transform: scale(0.985); transition-duration:.1s; }
.card__media.is-disabled img{ filter: saturate(.45) contrast(.96); }

.card__no,.card__go,.card__soon{
  position:absolute; bottom:9px;
  font-family: var(--font-mono);
  background: oklch(1 0 0 / .93);
  border:1px solid var(--border);
  border-radius:6px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.card__no{
  left:9px; padding:3px 7px;
  font-size:10px; letter-spacing:.14em;
  color: var(--fg);
}
.card__go{
  right:9px; width:24px; height:24px;
  display:grid; place-items:center;
  font-size:12px; line-height:1;
  color: var(--muted);
  transition: color .18s ease, border-color .18s ease, transform .18s ease;
}
a.card__media:hover .card__go{
  color: var(--accent);
  border-color: var(--accent);
  transform: translate(1px,-1px);
}
.card__soon{
  right:9px; padding:4px 8px;
  font-size:9px; letter-spacing:.14em;
  color: var(--muted);
}

/* —— 文字区：纯文本，任何状态都不变色、不上浮、无手型光标 —— */
.card__body{ display:flex; flex-direction:column; padding:0 5px 5px; }
.card__title{
  margin:0;
  font-family: var(--font-display);
  font-size:16.5px; font-weight:700; line-height:1.35; letter-spacing:0;
  color: var(--fg);
}
.card__title-en{
  margin:3px 0 0;
  font-family: var(--font-mono);
  font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color: var(--muted);
}
.card__desc{
  margin:8px 0 0;
  font-size:12.5px; line-height:1.7;
  color: var(--fg-2);
}
.card__tags{
  display:flex; flex-wrap:wrap; gap:5px;
  margin:10px 0 0; padding:0; list-style:none;
}
.card__tags li{
  font-family: var(--font-mono);
  font-size:9px; letter-spacing:.12em;
  color: var(--muted);
  border:1px solid var(--border);
  border-radius:4px;
  padding:2px 6px;
}

/* ═══════════════ 7. 收尾 ═══════════════ */
.contact{
  position:relative;
  min-height:82vh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center;
  padding: clamp(70px, 14vh, 150px) var(--pad) clamp(24px, 4vh, 44px);
}
.contact__inner{ max-width:620px; }
.contact__kicker{
  margin:0 0 12px;
  font-family: var(--font-mono);
  font-size:11px; letter-spacing:.34em; text-indent:.34em; text-transform:uppercase;
  color: var(--muted);
}
.contact__title{
  margin:0;
  font-family: var(--font-display);
  font-size: clamp(28px, 3.8vw, 50px);
  font-weight:700; line-height:1.2;
}
.contact__text{
  margin:18px 0 0;
  font-size:15px; line-height:1.85;
  color: var(--fg-2);
}
.contact__link{
  display:inline-block;
  margin-top:28px;
  padding:13px 24px;
  min-height:44px;
  border:1px solid var(--border);
  border-radius:999px;
  font-family: var(--font-mono);
  font-size:12px; letter-spacing:.1em;
  color: var(--fg);
  text-decoration:none;
  transition: border-color .18s ease, background-color .18s ease;
}
.contact__link:hover{
  border-color: var(--accent);
  background: var(--accent-soft);   /* 只动背景，前景不变 → 对比度只升不降 */
}

.footer{
  width:100%; max-width:1240px; margin:0 auto;
  padding: clamp(24px, 4vh, 44px) var(--pad) clamp(26px, 4.5vh, 48px);
  display:flex; flex-wrap:wrap; gap:10px 20px;
  justify-content:space-between; align-items:center;
  font-family: var(--font-mono);
  font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color: var(--muted);
}
.footer p{ margin:0; }

/* 暂停控件 —— 现在隧道由滚动驱动，没有自动播放，控件已移除。 */

/* ═══════════════ 8. MY WAY —— 底部 3D 字体透视过渡 ═══════════════ */
/* 参考 wodniack.dev 的做法：两份完全相同的文字分别进入两个裁切窗口。
   .distorted 通过 matrix3d + perspective 形成纵向梯形；.normal 保持平面。
   滚动时两份文字沿 Y 轴同步移动，穿过底部地平线，不做透明度交接。

   变量分工：
     --scroll-progress  滚动进度 0→1
     --distortion       透视强度，由 JS 按容器宽高计算
     --amplitude        单次平移距离：桌面 50% / 平板 62% / 手机 72%
     --offset           初始位移：桌面 15% / 平板 20% / 手机 27.5%
     --frame            字体空间与大裁切窗口的基准高度
     --vp               消失点纵向位置，SVG 网格与笑脸共用
*/
.my-way{
  --scroll-progress: 0;
  --distortion: 200;
  --amplitude: 50%;
  --offset: 15%;
  --frame: clamp(390px, 58vh, 650px);
  --type-size: clamp(88px, min(34vw, 54vh), 520px);
  --smiley-size: clamp(52px, 6vw, 90px);
  --vp: 30%;
  /* 超粗窄体：优先用户已授权的 Anton / Archivo Black，测试期退到系统自带的 Impact */
  --myway-font: 'Anton', 'Archivo Black', Impact, 'Haettenschweiler',
                'Arial Narrow', 'Franklin Gothic Heavy', system-ui, sans-serif;

  position:relative;
  z-index:3;
  height: clamp(720px, 112vh, 1120px);
  /* 折痕上移到区块内部，下面预留折页空间，再统一裁切，避免盖住联系区。 */
  overflow:clip;
  background: var(--bg);
}

/* —— 网格：从上下左右四边向同一个消失点连线 —— */
.my-way .grid-svg{
  position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none;
}
.my-way .grid-svg path{ fill:none; stroke: var(--border); stroke-width:1; }

/* —— 消失点上的圆脸：只是个坐标锚点，不做表情语义 —— */
.my-way .vanishing{
  position:absolute; left:50%; top:var(--vp);
  width: clamp(26px, 2.6vw, 38px); aspect-ratio:1;
  transform: translate(-50%,-50%);
  opacity:.5; pointer-events:none;
}
.my-way .vanishing svg{ display:block; width:100%; height:100%; }
.my-way .vanishing circle,
.my-way .vanishing path{ fill:none; stroke: var(--fg); stroke-width:2.4; stroke-linecap:round; }

/* —— 浮动缩略图：参考站属于可选装饰，这里关闭，避免干扰折页主体 —— */
.my-way .floaters{ display:none; }
.my-way .floaters img{
  position:absolute; width:clamp(72px, 8.5vw, 132px);
  border-radius:8px;
  border:1px solid var(--border);
  opacity:.36;
  will-change:transform;
}
.my-way .floaters img:nth-child(1){ left:6%;  top:46%; }
.my-way .floaters img:nth-child(2){ right:6%; top:38%; }
.my-way .floaters img:nth-child(3){ left:12%; top:74%; }

/* —— 两层舞台：相同的文字，各自被一个 overflow:hidden 窗口裁切 —— */
.my-way .catcher{
  --catcher-height: calc(var(--frame) * 1.05 + var(--smiley-size) / 2);
  position:absolute; left:0; right:0;
  bottom:clamp(260px, 42vh, 440px);
  height: var(--catcher-height);
  user-select:none;
  text-align:center;
  text-transform:uppercase;
  white-space:nowrap;
  line-height:.82;
  font-size:var(--type-size);
  pointer-events:none;
}

/* 上层窗口负责透视文字。height 给足，让梯形向地平线上方展开。 */
.my-way .distorted-wrapper{
  position:absolute; left:0; bottom:0;
  width:100%; height:calc(var(--frame) * 1.5);
  overflow:hidden;
  perspective:calc(var(--distortion) * .7em);
  perspective-origin:50% 100%;
}

/* 参考站使用的核心矩阵：让 z 随 y 变化，再由父级 perspective 产生梯形缩放。 */
.my-way .distorted{
  position:absolute; left:-100%; bottom:0;
  width:300%; height:var(--catcher-height);
  transform-origin:50% 100%;
  transform:matrix3d(
    1,0,0,0,
    0,1,var(--distortion),0,
    0,0,1,0,
    0,0,0,1
  );
  will-change:transform;
}

/* 下层窗口在裁切边界下方，负责接住、延续文字，避免切换时断层。 */
.my-way .normal-wrapper{
  position:absolute; top:calc(100% - 1px); left:0;
  width:100%; height:calc(100% + 100vh);
  overflow:hidden;
}
.my-way .normal{
  position:absolute; top:0; left:-100%;
  width:300%; height:100%;
  will-change:transform;
}

.my-way .text{
  position:absolute; left:0; width:100%;
  margin:0;
  font-family:var(--myway-font);
  font-weight:900;
  font-size:inherit;
  line-height:.82;
  letter-spacing:-.01em;
  text-transform:uppercase;
  color:var(--fg);
  will-change:transform;
}
.my-way .distorted .text{
  bottom:0;
  transform:translate3d(
    0,
    calc(var(--scroll-progress) * var(--amplitude) - var(--offset)),
    0
  );
}
.my-way .normal .text{
  top:0;
  transform:translate3d(
    0,
    calc(var(--scroll-progress) * var(--amplitude) - 100% - var(--offset)),
    0
  );
}
.my-way .text span{ display:block; white-space:nowrap; }


/* ═══════════════ 9. 减少动效 ═══════════════ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    transition-delay:0ms !important;
  }
  .hero__scroll-in{ animation:none; opacity:.65; }
  .cards .card{ opacity:1; transform:none; }
  .card__veil{ display:none; }
  /* MY WAY：JS 会直接给出静态主画面，这里去掉会动的装饰层 */
  .my-way .floaters{ display:none; }
}

/* ═══════════════ 10. 窄屏 ═══════════════ */
@media (max-width: 1023px){
  /* 中小屏：位移幅度加大，保证梯形拉得开又不溢出 */
  .my-way{
    --amplitude: 62%;
    --offset: 20%;
    --frame: clamp(340px, 52vh, 500px);

}
@media (max-width: 619px){

<script type="text/javascript">
(() => {
  'use strict';

  /* ══════════ 0. 项目数据 ══════════ */
  const PROJECTS = [
    { id:'01', file:'assets/01.png', titleZh:'GitHub 主页', titleEn:'GitHub Profile',
      descZh:'个人技术主页与开源空间', tags:['GITHUB','PROFILE'],
      url:'https://github.com/kanjyo-hirako', detailPage:null },

    { id:'02', file:'assets/02.png', titleZh:'网站收藏空间', titleEn:'Website Collection Space',
      descZh:'精选优质网站的收藏与导航平台', tags:['VUE','CURATION'],
      url:'https://website-collection-space.vercel.app/', detailPage:null },

    { id:'03', file:'assets/03.png', titleZh:'用户中心', titleEn:'User Center',
      descZh:'全栈用户管理与认证系统', tags:['VUE','AUTH','CRUD'],
      url:'https://kanjyo-hirako-user-center.vercel.app/', detailPage:null },

    { id:'04', file:'assets/04.png', titleZh:'智能旅游助手', titleEn:'AI Travel Agent',
      descZh:'AI 驱动的智能行程规划与景点推荐', tags:['VUE','AI','MOBILE'],
      url:'https://travel-agent-two-lovat.vercel.app/', detailPage:null },

    { id:'05', file:'assets/05.png', titleZh:'音乐番茄钟', titleEn:'Music Pomodoro',
      descZh:'沉浸式音乐番茄钟，专注与呼吸的空间', tags:['VUE','AUDIO','MOTION'],
      url:'https://github.com/kanjyo-hirako/Music-Pomodoro', detailPage:null },

    { id:'06', file:'assets/06.png', titleZh:'实验室预约系统', titleEn:'Lab Reservation System',
      descZh:'校园实验室智能预约与管理平台', tags:['VUE','SCHEDULING'],
      url:'https://github.com/kanjyo-hirako/lab-display-screen', detailPage:null },

    { id:'07', file:'assets/07.png', titleZh:'2048 网页游戏', titleEn:'2048 Page Game',
      descZh:'经典数字合并游戏，键盘与触屏均可操作', tags:['GAME','KEYBOARD','TOUCH'],
      url:'https://github.com/kanjyo-hirako/2048-Page-Game', detailPage:null },

    { id:'08', file:'assets/08.png', titleZh:'AI 小说转剧本工具', titleEn:'AI Script Converter',
      descZh:'将中文小说自动转换为结构化 YAML 剧本', tags:['AI','YAML','TOOL'],
      url:'https://github.com/kanjyo-hirako/AI-Script-Converter', detailPage:null }
  ];
  const N = PROJECTS.length;
  const TOTAL = String(N).padStart(2, '0');

  /* ══════════ 1. 工具 ══════════ */
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const $ = id => document.getElementById(id);

  const cylHost = $('cylinder');
  const stage   = $('stage');
  const track   = $('track');
  const myWay      = $('myWay');
  const rmQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

  const SCROLL_KEY = 'kanjyo:portfolio:scroll';
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  /* ══════════ 2. 构建卡片（<a> 只包图片，文字区纯文本） ══════════ */
  const cards = PROJECTS.map(p => {
    const article = document.createElement('article');
    article.className = 'card';
    article.setAttribute('data-od-id', 'project-card-' + p.id);

    const media = document.createElement(p.url ? 'a' : 'div');
    media.className = 'card__media' + (p.url ? '' : ' is-disabled');
    media.setAttribute('data-od-id', 'project-media-' + p.id);

    if (p.url){
      media.href = p.url;
      media.target = '_blank';
      media.rel = 'noopener noreferrer';
      media.setAttribute('aria-label', '在新标签页打开 ' + p.titleZh);
    } else {
      media.setAttribute('aria-disabled', 'true');
    }

    const img = document.createElement('img');
    img.src = p.file;
    img.alt = p.titleZh + ' 项目截图';
    // ★ 不能 lazy：圆柱模式下卡片大部分时间是 visibility:hidden，
    //   懒加载要等卡片「转出来」的那一刻才开始下载 —— 用户看到的就是一张白卡。
    //   当前项目图存放在 assets/01.png … assets/08.png。
    img.loading = 'eager';
    img.decoding = 'async';
    img.draggable = false;
    media.appendChild(img);

    const no = document.createElement('span');
    no.className = 'card__no';
    no.textContent = p.id + ' / ' + TOTAL;
    media.appendChild(no);

    const mark = document.createElement('span');
    if (p.url){
      mark.className = 'card__go';
      mark.setAttribute('aria-hidden', 'true');
      mark.textContent = '↗';
    } else {
      mark.className = 'card__soon';
      mark.textContent = 'COMING SOON';
    }
    media.appendChild(mark);
    article.appendChild(media);

    const body = document.createElement('div');
    body.className = 'card__body';

    const h3 = document.createElement('h3');
    h3.className = 'card__title';
    h3.textContent = p.titleZh;

    const en = document.createElement('p');
    en.className = 'card__title-en';
    en.textContent = p.titleEn;

    const desc = document.createElement('p');
    desc.className = 'card__desc';
    desc.textContent = p.descZh;

    const tags = document.createElement('ul');
    tags.className = 'card__tags';
    p.tags.forEach(t => {
      const li = document.createElement('li');
      li.textContent = t;
      tags.appendChild(li);
    });

    body.append(h3, en, desc, tags);
    article.appendChild(body);

    const veil = document.createElement('span');
    veil.className = 'card__veil';
    veil.setAttribute('aria-hidden', 'true');
    article.appendChild(veil);
    article.__veil = veil;

    cylHost.appendChild(article);
    return article;
  });

  /* ══════════ 3. 圆柱几何 ══════════
     展示是「逐个入场」：每张卡片有自己的进度区间，其它卡片不绘制。
     但每张卡片自己的弧线是完整的 —— 从左上方（柱体背面）转出来 → 扫过正面 → 转到右下角的后背消失。
     u 走到 ±2.5（±112.5°），所以「透明圆柱」那套（背面可见 / 淡化 / 模糊）依然生效。 */
  const STEP  = Math.PI / 4;   // 相邻卡片绕柱 45°
  // SWEEP 决定卡片在背面待多久：5.0 → 正面占 80%，前后各 10% 在背面。
  // 它同时也决定「每一级滚动转多少度」—— 调它可以改螺旋的快慢。
  const SWEEP = 5.0;           // 单张卡片扫过的「级」数 → u 从 -2.5 到 +2.5
  const FULL  = 0.10;          // 两端各 10% 行程用于淡入淡出（这两段正好落在柱体背面）
  const LEAD  = 0.03;          // 开场留白：很短的一段，然后 01 就进场
  // q：0 → N。每张卡片占 1 段，t = q - i。
  // 起点取 0：这样滚到底时 q = N，最后一张正好走完自己的弧线（绕到柱体后面消失），而不是停在正中。
  const qAt = p => clamp((p - LEAD) / (1 - LEAD), 0, 1) * N;

  let RADIUS = 430, PITCH = 158;
  let animated = null;
  let io = null;

  function measure(){
    const stageW = stage.clientWidth;
    const stageH = stage.clientHeight;
    const limit  = stageH / 2 - 10;          // 上下各留一点余量

    let w = clamp(Math.min(stageW * 0.28, stageH * 0.42), 168, 340);
    let cardH = 0;

    // 卡片宽度同时决定柱半径与螺旋落差 → 迭代收紧，直到单张卡片扫到最外侧时也装得下
    for (let k = 0; k < 5; k++){
      cards.forEach(c => { c.style.width = w + 'px'; });
      cardH  = Math.max.apply(null, cards.map(c => c.offsetHeight));
      RADIUS = w / (2 * Math.sin(STEP / 2)); // 弦长 ≈ 卡宽 → 卡片刚好贴满柱面
      PITCH  = w * 0.34;                     // 每绕一级下降的高度 → 螺旋而非平转

      const f = RADIUS * 3.6;
      // 取「不透明段的最外侧」—— 再往外就只有淡出中的卡片了，被切一点也看不见
      const u = (SWEEP / 2) * (1 - 2 * FULL) * 1.05;
      const sc = f / (f - RADIUS * Math.cos(u * STEP));
      const span = sc * (u * PITCH + cardH / 2);
      if (span <= limit) break;
      w *= Math.max(0.85, limit / span);
    }

    cards.forEach(c => { c.style.width = w + 'px'; });
    stage.style.perspective = (RADIUS * 3.6).toFixed(0) + 'px';
  }

  /* 把第 i 张卡片放到它这一段的进度 t（0→1）上；t 不在区间内就彻底隐藏 */
  function place(i, q){
    const t  = q - i;
    const el = cards[i];

    // 还没轮到 / 已经走完 —— 不绘制、不占 Tab 位、不接收点击
    if (t <= 0 || t >= 1){
      if (el.__on !== false){
        el.__on = false;
        el.style.visibility = 'hidden';
        el.style.opacity = '0';
      }
      return;
    }

    if (el.__on !== true){
      el.__on = true;
      el.style.visibility = 'visible';
    }

    const u = (t - 0.5) * SWEEP;     // -1.9 → +1.9
    const theta = u * STEP;
    const h = u * PITCH;             // CSS 的 +y 向下：越往后越低 → 左上进场、右下退场

    // translate(-50%,-50%) 先把卡片中心对到柱轴上，再推出半径、绕柱旋转、最后升降
    el.style.transform =
      'translate3d(0,' + h.toFixed(2) + 'px,0)' +
      ' rotateY(' + theta.toFixed(5) + 'rad)' +
      ' translateZ(' + RADIUS.toFixed(2) + 'px)' +
      ' translate(-50%,-50%)';

    // 进场 / 退场包络：两端各用 FULL 比例的行程淡入淡出 —— 这两段正好在柱体背面，
    // 所以卡片是「从柱体后面转出来」，而不是在屏幕边缘凭空出现。
    el.style.opacity = clamp(Math.min(t, 1 - t) / FULL, 0, 1).toFixed(3);

    // 透明圆柱：越接近背面越向白底退去（内层遮罩，与上面的入场包络互不干扰）
    const front = Math.cos(theta);   // 1 = 正对观众，0 = 侧面，-1 = 柱体正后方
    const veilV = clamp((1 - front) * 0.33, 0, 0.60).toFixed(3);
    if (veilV !== el.__veilV){
      el.__veilV = veilV;
      el.__veil.style.opacity = veilV;
    }

    // 转到背面的卡片：镜像绘制，所以要隐藏卡片自身的文字、模糊截图、去掉投影、移出 Tab / 点击
    const facing = front > 0.02;
    if (facing !== el.__facing){
      el.__facing = facing;
      el.classList.toggle('is-back', !facing);
      const link = el.firstElementChild;
      if (link && link.tagName === 'A'){
        if (facing) link.removeAttribute('tabindex');
        else link.setAttribute('tabindex', '-1');
      }
    }
  }

  function placeAll(q){ for (let i = 0; i < N; i++) place(i, q); }

  function clearCardStyles(){
    cards.forEach(c => {
      c.style.width = '';
      c.style.transform = '';
      c.style.opacity = '';
      c.style.visibility = '';
      c.classList.remove('is-back');
      const link = c.firstElementChild;
      if (link && link.tagName === 'A') link.removeAttribute('tabindex');
      c.__veil.style.opacity = '0';
      c.__veilV = null;
      c.__facing = null;
      c.__on = null;
    });
    stage.style.perspective = '';
  }

  /* ══════════ 4. 模式：圆柱 / 文档流 ══════════ */
  const wantsAnimated = () => !rmQuery.matches && window.innerWidth >= 880;

  function startReveal(){
    if (io){ io.disconnect(); io = null; }
    if (!('IntersectionObserver' in window)){
      cards.forEach(c => c.classList.add('in'));
      return;
    }
    io = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => {
        if (en.isIntersecting){ en.target.classList.add('in'); obs.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });
    cards.forEach(c => { c.classList.remove('in'); io.observe(c); });
  }

  /* 圆柱模式要把卡片放回 .stage，文档流模式要放回 <section> 里 —— 只改 class 不够 */
  function setMode(){
    const next = wantsAnimated();
    if (next === animated) return;
    animated = next;

    document.body.classList.toggle('is-animated', animated);

    if (animated){
      cylHost.className = 'cylinder';
      stage.appendChild(cylHost);
      if (io){ io.disconnect(); io = null; }
      cards.forEach(c => c.classList.remove('in'));
      measure();
      placeAll(qAt(scrollP));
      lastQ = qAt(scrollP);
    } else {
      clearCardStyles();
      cylHost.className = 'cards';
      track.parentNode.insertBefore(cylHost, track);
      startReveal();
      if (rmQuery.matches) cards.forEach(c => c.classList.add('in'));
    }
    cylHost.setAttribute('data-mode', animated ? 'cylinder' : 'flow');
  }

  /* ══════════ 5. 状态 ══════════ */
  let scrollP = 0;
  let needRead = true;
  let resizePending = false;

  function readScroll(){
    if (animated){
      const total = track.offsetHeight - window.innerHeight;
      scrollP = total > 0 ? clamp(-track.getBoundingClientRect().top / total, 0, 1) : 1;
    } else {
      scrollP = 1;
    }

    // MY WAY 的滚动目标也在这里读 —— 同一帧里的布局读取集中在一处，避免读写交替引起回流
    myWayTarget = rmQuery.matches ? MYWAY_STILL : myWayProgress();

    needRead = false;
  }

  let saveTimer = 0;
  function onScroll(){
    needRead = true;
    window.clearTimeout(saveTimer);
    saveTimer = window.setTimeout(() => {
      try { localStorage.setItem(SCROLL_KEY, String(Math.round(window.scrollY))); } catch (_){}
    }, 180);
  }

  /* ══════════ 6. 入场 ══════════ */
  const skipEntry = () => document.body.classList.add('is-ready', 'no-entry');
  const beginEntry = () => requestAnimationFrame(() => document.body.classList.add('is-ready'));

  /* ══════════ 7. 主循环 ══════════ */
  let lastQ = NaN;

  function frame(){
    if (resizePending){
      resizePending = false;
      setMode();
      if (animated) measure();              // 尺寸变了 → 重新解算柱半径与卡片宽度
      lastQ = NaN;                          // 强制重排一次
      measureMyWay();                       // distortion 与 SVG 网格都要按新尺寸重算
      needRead = true;
    }
    if (needRead) readScroll();

    if (animated){
      const q = qAt(scrollP);
      // 只有滚动位置真的变了才写 DOM
      if (Math.abs(q - lastQ) > 0.0004){
        lastQ = q;
        placeAll(q);
      }
    }

    // MY WAY：把滚动目标 lerp 平滑后写进 CSS 变量；关闭动效时直接给最终静态画面。
    if (rmQuery.matches){
      if (myWayDrawn !== MYWAY_STILL){ myWaySmooth = MYWAY_STILL; drawMyWay(); }
    } else {
      myWaySmooth += (myWayTarget - myWaySmooth) * MYWAY_LERP;
      if (Math.abs(myWayTarget - myWaySmooth) < 0.0008) myWaySmooth = myWayTarget;   // 收敛后吸附，免得永远差一点点
      if (Math.abs(myWaySmooth - myWayDrawn) > 0.0002) drawMyWay();
    }

    requestAnimationFrame(frame);
  }

  /* ══════════ 8. 启动 ══════════ */
  function boot(){
    $('year').textContent = String(new Date().getFullYear());

    setMode();
    measureMyWay();                // 先算出 distortion 与 SVG 网格
    readScroll();
    drawMyWay();                   // 再画一帧，避免首屏空白

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', () => { resizePending = true; }, { passive: true });
    if (rmQuery.addEventListener) rmQuery.addEventListener('change', () => { resizePending = true; });

    let restored = 0;
    try { restored = parseInt(localStorage.getItem(SCROLL_KEY) || '0', 10) || 0; } catch (_){}

    if (restored > 40){
      skipEntry();
      requestAnimationFrame(() => { window.scrollTo(0, restored); needRead = true; });
    } else {
      beginEntry();
    }

    requestAnimationFrame(frame);
  }

  /* ══════════ 9. MY WAY —— 底部 3D 字体透视过渡 ══════════
     参考 wodniack.dev 的做法，两份相同文字分别放入透视裁切层和平面裁切层。
     滚动进度只负责沿 Y 轴推字，透视矩阵本身保持不变：
       progress 0   文字位于裁切窗口上方
       progress .5  文字穿过地平线，梯形造型最完整
       progress 1   文字移动到裁切窗口下方
     两层内容由同一份 LINES 生成，所以永远逐字一致。 */
  const MYWAY_LINES = ['CODING', 'MY WAY', 'SINCE', '2026'];
  const MYWAY_STILL = 0.5;      // 减少动效时停在最完整的透视画面
  const MYWAY_LERP  = 0.1;      // 平滑系数：smooth += (target - smooth) * 0.1

  const myWayGrid   = $('myWayGrid');
  const myWayFloat  = $('myWayFloaters');
  const myWayTextA  = $('myWayTextA');
  const myWayTextB  = $('myWayTextB');

  // 同一份内容灌进两层 —— 「两份内容必须完全一致」由构造方式保证，而不是靠人抄两遍
  MYWAY_LINES.forEach(txt => {
    const a = document.createElement('span'); a.textContent = txt; myWayTextA.appendChild(a);
    const b = document.createElement('span'); b.textContent = txt; myWayTextB.appendChild(b);
  });

  // 浮动缩略图：复用已压过的项目图，取 2 / 5 / 7 三张，只在外侧活动
  [2, 5, 7].forEach((n, i) => {
    const img = document.createElement('img');
    img.src = 'assets/' + String(n).padStart(2, '0') + '.png';
    img.alt = '';
    img.loading = 'eager';
    img.decoding = 'async';
    img.draggable = false;
    myWayFloat.appendChild(img);
  });

  let myWayTarget = 0;          // 滚动算出的目标进度
  let myWaySmooth = 0;          // lerp 后的进度（真正写进 CSS 变量）
  let myWayDistortion = 200;    // 透视强度（无单位，等于 px）
  let myWayDrawn = NaN;
  let myWayCentered = null;     // 消失点相对区块的高度比例，缓存用

  /* ① 透视强度：distortion = hypot(width, (height - centerY) / 2) * 0.14
        centerY 取消失点（默认 30% 区块高）。窗口尺寸一变就重算。 */
  function measureMyWay(){
    const W = myWay.clientWidth || 1;
    const H = myWay.clientHeight || 1;
    const vpRatio = parseFloat(getComputedStyle(myWay).getPropertyValue('--vp')) / 100 || 0.3;
    myWayCentered = vpRatio;
    myWayDistortion = Math.hypot(W, (H - H * vpRatio) / 2) * 0.14;
    buildMyWayGrid();
  }

  /* ② SVG 网格：从上下边和左右边各取若干点，连向同一个消失点。
        这里采用参考站的 12 列 / 8 列密度，窗口变化时重算 path。 */
  function buildMyWayGrid(){
    const W = myWay.clientWidth || 1;
    const H = myWay.clientHeight || 1;
    const cx = W / 2;
    const cy = H * (myWayCentered ?? 0.3);
    const columns = W > 767 ? 12 : 8;
    const columnW = W / columns;
    const rows = columns;
    const rowH = H / rows;
    const rowOffset = (H - rowH * rows) / 2;
    const d = [`M0 ${H.toFixed(1)} L${W.toFixed(1)} ${H.toFixed(1)}`];

    for (let c = 0; c <= columns; c++){
      const x = columnW * c;
      d.push(`M${x.toFixed(1)} 0 L${cx.toFixed(1)} ${cy.toFixed(1)}`);
      d.push(`M${x.toFixed(1)} ${H.toFixed(1)} L${cx.toFixed(1)} ${cy.toFixed(1)}`);
    }
    for (let r = 1; r < rows; r++){
      const y = rowOffset + rowH * r;
      d.push(`M0 ${y.toFixed(1)} L${cx.toFixed(1)} ${cy.toFixed(1)}`);
      d.push(`M${W.toFixed(1)} ${y.toFixed(1)} L${cx.toFixed(1)} ${cy.toFixed(1)}`);
    }

    myWayGrid.setAttribute('viewBox', `0 0 ${W} ${H}`);
    let path = myWayGrid.querySelector('path');
    if (!path){
      path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      myWayGrid.appendChild(path);
    }
    path.setAttribute('d', d.join(' '));
  }

  /* ③ 滚动进度：区块顶部进入视口底部为 0，区块底部离开视口顶部为 1。
        区块在视口中居中时约为 .5，也就是透视字形最完整的时刻。 */
  function myWayProgress(){
    const r = myWay.getBoundingClientRect();
    const H = r.height || 1;
    const viewportH = window.innerHeight || 1;
    return clamp((viewportH - r.top) / (H + viewportH), 0, 1);
  }

  /* ④ 写变量。CSS 侧由 --scroll-progress 和 --distortion 推出两层变换。 */
  function drawMyWay(){
    const p = myWaySmooth;
    myWay.style.setProperty('--scroll-progress', p.toFixed(4));
    myWay.style.setProperty('--distortion', myWayDistortion.toFixed(1));

    if (myWayFloat){
      const imgs = myWayFloat.children;
      for (let i = 0; i < imgs.length; i++){
        const el = imgs[i];
        const k = (i - 2);                       // -2 / 0 / 1 之类的相位差，靠 CSS 里的 --fx/--fz 定基调
        const z = -260 + p * 420 + k * 90;
        el.style.transform =
          'translate3d(' + (p * 26 + k * 12).toFixed(1) + 'px,' +
          ((1 - p) * 120 + k * 34).toFixed(1) + 'px,' + z.toFixed(0) + 'px)' +
          ' scale(' + (0.72 + p * 0.34).toFixed(3) + ')' +
          ' rotateX(' + (18 - p * 26).toFixed(1) + 'deg)' +
          ' rotateY(' + (k * 9).toFixed(1) + 'deg)';
      }
    }
    myWayDrawn = p;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
